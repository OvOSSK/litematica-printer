plugins { id 'fabric-loom' version '1.5.8' }
version='0.7.2.1-hana-neko.1'
group='me.aleksilassila'
base { archivesName='litematica-printer-hana-mc1.20.1' }
repositories {
 mavenCentral()
 maven { url 'https://api.modrinth.com/maven' }
 maven { url 'https://www.cursemaven.com' }
 maven { url 'https://maven.kyrptonaught.dev' }
 maven { url 'https://maven.terraformersmc.com/releases' }
}
dependencies {
 testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
 testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
 minecraft 'com.mojang:minecraft:1.20.1'
 mappings loom.officialMojangMappings()
 modImplementation 'net.fabricmc:fabric-loader:0.16.14'
 modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.2+1.20.1'
 modImplementation 'maven.modrinth:malilib:0.16.3'
 modImplementation 'maven.modrinth:litematica:0.15.4'
 modImplementation 'maven.modrinth:tweakeroo:0.17.1'
 modImplementation 'maven.modrinth:modmenu:7.2.2'
 modImplementation 'curse.maven:quick-shulker-362669:4592296'
 modImplementation 'net.kyrptonaught:kyrptconfig:1.5.4-1.20'
 implementation 'com.belerweb:pinyin4j:2.5.1'
 include 'com.belerweb:pinyin4j:2.5.1'
 compileOnly 'org.projectlombok:lombok:1.18.42'
 annotationProcessor 'org.projectlombok:lombok:1.18.42'
}
java { sourceCompatibility=JavaVersion.VERSION_17; targetCompatibility=JavaVersion.VERSION_17; withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8'; options.release=17; options.compilerArgs += ['-Xmaxerrs','200'] }
jar { from('LICENSE.md') }

test { useJUnitPlatform() }

jar { from('PORT-NOTICE.txt') }
